version: '3.8'

services:
  # Infrastructure Services
  # LocalStack for AWS services emulation
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialize LocalStack with required resources
  localstack-init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-west-2
    entrypoint: /bin/sh -c
    command: |
      "
      # Wait for LocalStack
      sleep 5

      # Create S3 buckets
      aws --endpoint-url=http://localstack:4566 s3 mb s3://hls-pipeline-raw
      aws --endpoint-url=http://localstack:4566 s3 mb s3://hls-pipeline-processed

      # Create SQS queues
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name hls-pipeline-jobs
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name hls-pipeline-dlq

      # Create DynamoDB table
      aws --endpoint-url=http://localstack:4566 dynamodb create-table \
        --table-name hls-pipeline-videos \
        --attribute-definitions AttributeName=id,AttributeType=S \
        --key-schema AttributeName=id,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST

      # Configure S3 event notifications to SQS
      aws --endpoint-url=http://localstack:4566 s3api put-bucket-notification-configuration \
        --bucket hls-pipeline-raw \
        --notification-configuration '{
          \"QueueConfigurations\": [{
            \"QueueArn\": \"arn:aws:sqs:us-west-2:000000000000:hls-pipeline-jobs\",
            \"Events\": [\"s3:ObjectCreated:*\"],
            \"Filter\": {
              \"Key\": {
                \"FilterRules\": [{
                  \"Name\": \"prefix\",
                  \"Value\": \"uploads/\"
                }]
              }
            }
          }]
        }'

      echo 'LocalStack initialized!'
      "

  # HLS Pipeline Services
  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=hls-pipeline-raw
      - PROCESSED_BUCKET=hls-pipeline-processed
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/hls-pipeline-jobs
      - DYNAMODB_TABLE=hls-pipeline-videos
      - CDN_DOMAIN=localhost:8080
      - JWT_SECRET=dev-jwt-secret-at-least-32-chars-long
      - LOG_LEVEL=debug
    depends_on:
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=hls-pipeline-raw
      - PROCESSED_BUCKET=hls-pipeline-processed
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/hls-pipeline-jobs
      - DYNAMODB_TABLE=hls-pipeline-videos
      - CDN_DOMAIN=localhost:8080
      - MAX_CONCURRENT_JOBS=2
      - LOG_LEVEL=debug
    depends_on:
      localstack-init:
        condition: service_completed_successfully
    volumes:
      - worker-tmp:/tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Live Streaming Services
  # MediaMTX - Media server for SRT/RTMP/RTSP
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"     # RTMP
      - "8554:8554"     # RTSP
      - "8889:8889"     # WebRTC
      - "8890:8890"     # SRT
      - "9997:9997"     # API
    environment:
      - MTX_PROTOCOLS=tcp,udp
      - MTX_RTMPADDRESS=:1935
      - MTX_RTSPADDRESS=:8554
      - MTX_WEBRTCADDRESS=:8889
      - MTX_SRTADDRESS=:8890
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_METRICS=yes
      - MTX_METRICSADDRESS=:9998
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9997/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Live Service
  live:
    build:
      context: .
      dockerfile: Dockerfile.live
    ports:
      - "8081:8080"     # API
      - "9000-9010:9000-9010/udp"  # SRT ports
    environment:
      - PORT=8080
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - OUTPUT_BUCKET=hls-pipeline-processed
      - CDN_DOMAIN=localhost:8080
      - MEDIAMTX_URL=mediamtx
      - MEDIAMTX_API_PORT=9997
      - SRT_PORT_RANGE_START=9000
      - SRT_PORT_RANGE_END=9010
      - LOG_LEVEL=debug
    depends_on:
      mediamtx:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    volumes:
      - live-tmp:/tmp

# Volumes
volumes:
  localstack-data:
  worker-tmp:
  live-tmp:

# Networks
networks:
  default:
    name: hls-pipeline

